<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { --sh:#fff; --a:#d6336c; --ad:#a3173f; --bg:#fff3c9; --grid:rgba(255,214,102,.35); --blob:#ffb3cf; --paper:#fff9e6; --ink:#b8455f; }
  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Patrick Hand", "Comic Sans MS", cursive; color: var(--a);
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 18px, transparent 18px 36px),
      repeating-linear-gradient(90deg, var(--grid) 0 18px, transparent 18px 36px), var(--bg);
    display: flex; justify-content: center; overflow-x: hidden;
  }
  body::before, body::after { content: ""; position: fixed; width: 55vmin; height: 40vmin; background: var(--blob); opacity: .75; z-index: 0; pointer-events: none; }
  body::before { top: 0; left: 0; clip-path: polygon(0 0,100% 0,70% 30%,80% 55%,40% 75%,0 100%); }
  body::after  { bottom: 0; right: 0; clip-path: polygon(100% 0,100% 100%,0 100%,25% 70%,15% 45%,60% 25%); }

  main { position: relative; z-index: 1; width: min(100%, 460px); min-height: 100%; padding: 26px 20px 56px; }
  .screen { display: none; min-height: calc(100vh - 80px); flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  .screen.active { display: flex; animation: pop .4s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }

  h1 { font-family: "Gochi Hand", cursive; font-weight: 400; margin: 0; line-height: 1.05; font-size: clamp(2.1rem, 9vw, 3.2rem); text-shadow: 2px 2px 0 var(--sh); }
  p { font-size: 1.3rem; margin: 0; }
  .sticker { font-size: 92px; line-height: 1; filter: drop-shadow(0 4px 0 rgba(0,0,0,.08)); }
  .sticker img { width: 170px; max-width: 60vw; height: auto; filter: drop-shadow(0 4px 0 rgba(0,0,0,.1)); }
  .wiggle { animation: wiggle 2.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  button { font: inherit; font-size: 1.45rem; cursor: pointer; border: 3px solid #fff; background: var(--a); color: #fff; padding: 8px 28px; border-radius: 999px; box-shadow: 0 5px 0 var(--ad); transition: transform .12s, box-shadow .12s; }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ad); }
  button:focus-visible, input:focus-visible { outline: 3px dashed var(--ad); outline-offset: 4px; }
  .next { background: var(--ad); padding: 2px 20px; font-size: 1.9rem; }
  .btn-row { display: flex; gap: 16px; align-items: center; min-height: 64px; }

  input { font: inherit; font-size: 1.4rem; text-align: center; padding: 8px 14px; border: 3px solid #fff; border-radius: 14px; background: var(--paper); color: var(--ink); width: 220px; }

  /* gifts */
  .gifts { display: flex; flex-direction: column; gap: 12px; }
  .gift { background: none; border: 0; box-shadow: none; padding: 0; font-size: 80px; line-height: 1; }
  .gift:hover { transform: rotate(-6deg) scale(1.08); }
  .gift.opened { filter: grayscale(.5) opacity(.55); }

  dialog { border: 3px solid #fff; border-radius: 18px; background: var(--paper); color: var(--ink); max-width: min(88vw, 400px); padding: 24px; font-size: 1.35rem; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.15); }
  dialog::backdrop { background: rgba(0,0,0,.3); }
  dialog .sticker { font-size: 60px; }
  dialog .sticker img { width: 120px; }

  /* tags */
  .tagbox { position: relative; width: 100%; height: 380px; }
  .tagbox .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  .tag { position: absolute; font-size: 1.25rem; color: var(--ink); opacity: 0; transform: scale(.7); transition: opacity .5s, transform .5s; white-space: nowrap; }
  .tag.in { opacity: 1; transform: scale(1) rotate(var(--r, 0deg)); }

  /* gallery */
  .strip { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; padding: 10px 6px 18px; }
  .polaroid { flex: 0 0 74%; scroll-snap-align: center; background: #fff; padding: 12px 12px 14px; border-radius: 6px; box-shadow: 0 8px 0 rgba(0,0,0,.1); transform: rotate(var(--r)); }
  .polaroid .ph { aspect-ratio: 1; background: var(--paper); display: grid; place-items: center; font-size: 90px; overflow: hidden; border-radius: 3px; }
  .polaroid img { width: 100%; height: 100%; object-fit: cover; }
  .polaroid figcaption { margin-top: 10px; font-size: 1.25rem; color: var(--ink); }
  .hint { font-size: 1rem; opacity: .75; }

  /* reasons */
  .card { background: var(--paper); border: 3px solid #fff; border-radius: 18px; box-shadow: 0 8px 0 rgba(0,0,0,.12); padding: 28px 22px; min-height: 150px; width: 100%; display: grid; place-items: center; color: var(--ink); font-size: 1.5rem; }
  .card.flip { animation: pop .35s ease-out; }

  /* letter */
  .letter { background: var(--paper); border: 3px solid #fff; border-radius: 14px; padding: 20px; box-shadow: 0 8px 0 rgba(0,0,0,.12); width: 100%; min-height: 220px; text-align: left; color: var(--ink); background-image: repeating-linear-gradient(transparent 0 31px, rgba(0,0,0,.08) 31px 32px); line-height: 32px; font-size: 1.28rem; white-space: pre-line; }
  .ps { align-self: flex-end; transform: rotate(-6deg); font-family: "Gochi Hand", cursive; font-size: 1.4rem; }


  /* scratch */
  .scratchwrap { position: relative; width: 100%; height: 170px; border-radius: 16px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 8px 0 rgba(0,0,0,.12); }
  .scratchwrap .under { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; background: var(--paper); color: var(--ink); font-size: 1.5rem; }
  .scratchwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }

  /* quiz */
  .opts { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  button.opt { background: var(--paper); color: var(--ink); border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.12); font-size: 1.25rem; border-radius: 16px; padding: 10px 14px; }
  button.opt.good { background: #c9f4d8; color: #17623a; }
  button.opt.bad  { background: #ffd0d0; color: #8e1b1b; }
  button.opt:disabled { cursor: default; transform: none; }

  /* coupons */
  .coupons { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  button.coupon { position: relative; background: var(--paper); color: var(--ink); border: 3px dashed var(--a); border-radius: 12px; box-shadow: none; width: 100%; font-size: 1.3rem; padding: 16px 12px; }
  button.coupon .stamp { display: none; position: absolute; inset: 0; place-items: center; color: var(--a); font-family: "Gochi Hand", cursive; font-size: 2rem; transform: rotate(-8deg); }
  button.coupon.used span { opacity: .3; text-decoration: line-through; }
  button.coupon.used .stamp { display: grid; }

  /* meter / counter */
  .big { font-family: "Gochi Hand", cursive; font-size: clamp(3.4rem, 18vw, 5.5rem); line-height: 1; text-shadow: 3px 3px 0 var(--sh); }
  input[type=range] { width: 85%; padding: 0; border: 0; background: none; accent-color: var(--a); height: 36px; }

  /* promises */
  .promises { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .promise { display: flex; align-items: center; gap: 12px; background: var(--paper); border: 3px solid #fff; border-radius: 14px; padding: 12px 14px; color: var(--ink); font-size: 1.22rem; text-align: left; cursor: pointer; }
  .promise input { width: 26px; height: 26px; padding: 0; border: 0; accent-color: var(--a); flex: none; }
  .promise:has(input:checked) span { text-decoration: line-through; opacity: .6; }


  /* cute extras */
  .spark { position: fixed; z-index: 9; pointer-events: none; font-size: 22px; transform: translate(-50%,-50%); animation: spark .8s ease-out forwards; }
  @keyframes spark { to { transform: translate(-50%,-150%) scale(1.4); opacity: 0; } }
  .floaters { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .floaters span { position: absolute; bottom: -50px; opacity: .35; animation: drift linear infinite; }
  @keyframes drift { to { transform: translateY(-115vh) rotate(40deg); } }
  #snd { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 7; padding: 4px 12px; font-size: 1.3rem; }

  .bubble { position: relative; background: #fff; color: var(--ink); border-radius: 18px; padding: 10px 18px; font-size: 1.3rem; box-shadow: 0 4px 0 rgba(0,0,0,.1); margin-bottom: 8px; }
  .bubble::after { content: ""; position: absolute; bottom: -10px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }
  button.pet { background: none; border: 0; box-shadow: none; font-size: 130px; padding: 0; line-height: 1; }
  button.pet:active { transform: scale(.9); }
  button.pet.wobble { animation: wobble .45s; }
  @keyframes wobble { 25% { transform: rotate(-14deg) scale(1.1); } 50% { transform: rotate(12deg) scale(1.15); } 75% { transform: rotate(-8deg); } }

  .arena { position: relative; width: 100%; height: 340px; border: 3px dashed var(--a); border-radius: 18px; overflow: hidden; background: rgba(255,255,255,.45); touch-action: manipulation; }
  .fallh { position: absolute; top: 0; font-size: 40px; cursor: pointer; user-select: none; animation: fallh linear forwards; }
  @keyframes fallh { from { transform: translateY(-50px); } to { transform: translateY(380px); } }

  .mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
  button.cardm { aspect-ratio: 1; font-size: 2rem; padding: 0; background: var(--a); color: #fff; border: 3px solid #fff; border-radius: 14px; box-shadow: 0 4px 0 var(--ad); }
  button.cardm.open, button.cardm.done { background: var(--paper); }
  button.cardm.done { opacity: .55; cursor: default; }


  /* ultra cute */
  h1 .w { display: inline-block; white-space: nowrap; }
  h1 .ch { display: inline-block; }
  .screen.active h1 .ch { animation: hop .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--i) * 35ms); }
  @keyframes hop { from { transform: translateY(18px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  button:disabled { opacity: .6; cursor: default; }

  #mascot { position: fixed; left: 10px; bottom: 30px; z-index: 7; }
  #mface { font-size: 1.8rem; padding: 2px 10px; background: var(--paper); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  #mbub { position: absolute; bottom: 100%; left: 0; width: max-content; max-width: 56vw; font-size: 1.05rem; padding: 6px 12px; margin: 0 0 12px; }
  #mbub::after { left: 24px; margin-left: 0; }

  .board { position: relative; width: 100%; height: 250px; border: 3px dashed var(--a); border-radius: 18px; background: var(--paper); overflow: hidden; touch-action: manipulation; cursor: crosshair; }
  .board .bh { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); opacity: .6; font-size: 1.2rem; padding: 12px; pointer-events: none; }
  .placed { position: absolute; transform: translate(-50%,-50%) rotate(var(--r)); animation: stamp .25s ease-out; pointer-events: none; }
  @keyframes stamp { from { transform: translate(-50%,-50%) scale(1.8) rotate(var(--r)); opacity: 0; } }
  .tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button.stk { background: var(--paper); border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.12); font-size: 1.6rem; padding: 2px 10px; border-radius: 14px; }
  button.stk.sel { outline: 3px solid var(--a); }

  .hugcat { transition: transform .1s linear; }
  .meterbar { width: 80%; height: 18px; border-radius: 99px; background: #fff; border: 3px solid #fff; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.08); }
  .meterbar i { display: block; height: 100%; width: 0; background: var(--a); border-radius: 99px; transition: width .1s linear; }
  button.hold { user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none; }

  .wheelwrap { position: relative; width: 250px; padding-top: 26px; }
  .pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 2rem; color: var(--ad); z-index: 2; line-height: 1; }
  .wheel { position: relative; width: 250px; height: 250px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 8px 0 rgba(0,0,0,.12); }
  .wl { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; text-align: center; font-size: 30px; line-height: 36px; }

  .nick { font-size: clamp(2rem, 10vw, 3rem); min-height: 1.3em; }

  .receipt { background: var(--paper); border: 3px solid #fff; border-radius: 8px; padding: 18px; width: 100%; color: var(--ink); box-shadow: 0 8px 0 rgba(0,0,0,.12); font-size: 1.2rem; text-align: left; }
  .receipt .rh { font-family: "Gochi Hand", cursive; font-size: 1.8rem; text-align: center; margin-bottom: 8px; }
  .receipt .ri { display: flex; gap: 6px; align-items: baseline; margin: 4px 0; }
  .receipt .lead { flex: 1; border-bottom: 2px dotted currentColor; opacity: .35; transform: translateY(-4px); }
  .receipt hr { border: 0; border-top: 2px dashed currentColor; opacity: .35; margin: 10px 0; }
  .receipt .rf { text-align: center; font-size: 1.05rem; margin-top: 10px; }

  .bars { display: flex; gap: 6px; align-items: flex-end; height: 50px; }
  .bars i { width: 8px; height: 14px; background: var(--a); border-radius: 4px; }
  .bars.on i { animation: bar .7s ease-in-out infinite alternate; }
  .bars.on i:nth-child(2) { animation-delay: .1s; } .bars.on i:nth-child(3) { animation-delay: .2s; }
  .bars.on i:nth-child(4) { animation-delay: .3s; } .bars.on i:nth-child(5) { animation-delay: .4s; }
  @keyframes bar { to { height: 48px; } }

  .dots { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 6; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; border: 2px solid var(--a); }
  .dots i.on { background: var(--a); }
  #music { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 7; padding: 4px 12px; font-size: 1.3rem; }
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
  .hearts span { position: absolute; bottom: -40px; font-size: 26px; animation: rise 3.4s linear forwards; }
  @keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
  /* image stickers used like emoji */
  .gimg { display: inline-block; width: 1em; height: auto; vertical-align: middle; pointer-events: none; }
  button.pet .gimg { width: 150px; max-width: 55vw; }
  button.cardm .gimg { width: 72%; height: 72%; object-fit: contain; }
  button.stk .gimg { width: 38px; height: 38px; object-fit: contain; }
  .placed .gimg { width: 1.9em; }
  .wl .gimg { width: 34px; height: 34px; object-fit: contain; }
  .card .gimg { width: 1.4em; }
  .spark .gimg { width: 1.7em; }
  .floaters .gimg { width: 2.4em; }
  .hearts .gimg { width: 1.8em; }
  #mface .gimg { width: 40px; height: 40px; object-fit: contain; display: block; }
  .tagbox .sticker img { width: 150px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<div class="dots" id="dots" aria-hidden="true"></div>
<div class="hearts" id="hearts" aria-hidden="true"></div>

const stick = (s, cls = "") => `<div class="sticker ${cls}">${isImg(s) ? `<img src="${s}" alt="">` : s}</div>`;

const app = document.getElementById("app"), dotsBox = document.getElementById("dots");
const list = []; let cur = 0, audio = null;

function show(i) {
  cur = Math.max(0, Math.min(i, list.length - 1));
  list.forEach((s, n) => s.el.classList.toggle("active", n === cur));
  [...dotsBox.children].forEach((d, n) => d.classList.toggle("on", n === cur));
  window.scrollTo(0, 0);

}
const next = () => show(cur + 1);

function burst() {
  chime();

/* ---------- cute extras: tap sparkles, drifting bows, tiny sounds ---------- */
const CUTE = Object.assign({ sparkles: true, floaters: true, sound: true, mascot: true }, CONFIG.cute || {});
let ac = null, muted = !CUTE.sound;
function tone(f, d, t = "sine", v = .06, when = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + when;
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d);
  } catch (_) {}
}
const pip = () => tone(520 + Math.random() * 380, .09);
const chime = () => [784, 988, 1319].forEach((f, i) => tone(f, .22, "triangle", .05, i * .08));

});

}

  openwhen(c) {

    const r = e.querySelector("#r"), nb = e.querySelector(".next"); let first = true; nb.onclick = next;
    e.querySelectorAll(".coupon").forEach(b => b.onclick = () => {
      r.hidden = false; r.textContent = fmt(c.items[+b.dataset.i].note);
      r.classList.remove("flip"); void r.offsetWidth; r.classList.add("flip");
      e.querySelectorAll(".coupon").forEach(x => x.style.borderStyle = x === b ? "solid" : "dashed");
      nb.hidden = false; if (first) { first = false; burst(); }
    });
    return { el: e };
  },

  coupons(c) {
    const e = el(`<h1>${esc(c.title)}</h1><div class="coupons">${c.items.map(t => `<button class="coupon"><span>${esc(t)}</span><b class="stamp">REDEEMED</b></button>`).join("")}</div><p class="hint">tap a coupon to redeem it</p>${nextBtn(false)}`);
    e.querySelectorAll(".coupon").forEach(b => b.onclick = () => { if (!b.classList.contains("used")) { b.classList.add("used"); burst(); } });
    e.querySelector(".next").onclick = next; return { el: e };
  },

  meter(c) {
    const levels = c.levels || [[0, "hmm…"], [30, "a little bit 🤏"], [60, "quite a lot"], [90, "almost…"]];
    const e = el(`<h1>${esc(c.title)}</h1>${stick(c.sticker || "😻", "wiggle")}<div class="big" id="v">0%</div><input type="range" id="r" min="0" max="100" value="0" aria-label="love meter"><p id="m" class="hint">${esc(c.start || "drag the slider")}</p>${nextBtn(true)}`);
    const r = e.querySelector("#r"), v = e.querySelector("#v"), m = e.querySelector("#m"), nb = e.querySelector(".next"); let fired = false;
    nb.onclick = next;
    r.addEventListener("input", () => {
      const n = +r.value; v.textContent = n >= 100 ? "∞" : n + "%";
      if (n >= 100) { m.textContent = fmt(c.max || "Off the charts 💥"); if (!fired) { fired = true; burst(); } nb.hidden = false; }
      else { let t = levels[0][1]; levels.forEach(l => { if (n >= l[0]) t = l[1]; }); m.textContent = fmt(t); }
    });
    return { el: e };
  },

  together(c) {
    const e = el(`<h1>${esc(c.title)}</h1><div class="big" id="d">0</div><p id="u"></p><p id="s" class="hint"></p>${c.note ? `<p class="hint" style="opacity:.9">${esc(fmt(c.note))}</p>` : ""}${nextBtn(false)}`);
    const d = e.querySelector("#d"), u = e.querySelector("#u"), sl = e.querySelector("#s");
    e.querySelector(".next").onclick = next;
    function tick() {
      if (!e.classList.contains("active")) return;
      const t = new Date(c.date + "T00:00:00");
      if (isNaN(t)) { d.textContent = "?"; u.textContent = "Set a valid date like 2024-02-14 in the config"; return; }
      const diff = Math.abs(c.mode === "until" ? t - new Date() : new Date() - t);
      d.textContent = Math.floor(diff / 864e5); u.textContent = fmt(c.label || "days together");
      sl.textContent = Math.floor(diff % 864e5 / 36e5) + "h " + Math.floor(diff % 36e5 / 6e4) + "m " + Math.floor(diff % 6e4 / 1e3) + "s";
    }
    setInterval(tick, 1000);
    return { el: e, onShow: tick };
  },

  promises(c) {
    const e = el(`<h1>${esc(c.title)}</h1><div class="promises">${c.items.map(t => `<label class="promise"><input type="checkbox"><span>${esc(t)}</span></label>`).join("")}</div><p class="hint">tick every promise to continue</p>${nextBtn(true)}`);
    const boxes = [...e.querySelectorAll("input")], nb = e.querySelector(".next"); nb.onclick = next;
    boxes.forEach(b => b.addEventListener("change", () => { if (boxes.every(x => x.checked)) { burst(); nb.hidden = false; } else nb.hidden = true; }));
    return { el: e };
  },


  pet(c) {
    const faces = c.faces || ["😺", "😸", "😻", "😽"], goal = c.goal || 10, lines = c.lines || ["purr…", "mrrp!", "more pls 🥺"];
    const e = el(`<h1>${esc(c.title)}</h1><div class="bubble" id="b"></div><button class="pet" id="k" aria-label="pet the kitty"></button><p class="hint" id="cnt"></p>${nextBtn(true)}`);
    const b = e.querySelector("#b"), k = e.querySelector("#k"), cnt = e.querySelector("#cnt"), nb = e.querySelector(".next"); let n = 0;
    nb.onclick = next;
    function draw() { k.innerHTML = glyph(faces[Math.min(Math.floor(n / goal * faces.length), faces.length - 1)]); cnt.textContent = Math.min(n, goal) + " / " + goal + " pets"; }
    k.onclick = () => {
      n++; draw(); k.classList.remove("wobble"); void k.offsetWidth; k.classList.add("wobble");
      if (n >= goal) { b.textContent = fmt(c.done || "I love you too 😻"); nb.hidden = false; if (n === goal) burst(); }
      else b.textContent = fmt(lines[n % lines.length]);
    };
    return { el: e, onShow() { n = 0; nb.hidden = true; b.textContent = fmt(c.start || "pet me?"); draw(); } };
  },

  pop(c) {
    const goal = c.goal || 10;
    const e = el(`<h1>${esc(c.title)}</h1><p class="hint" id="sc"></p><div class="arena" id="ar"></div>${nextBtn(true)}`);
    const ar = e.querySelector("#ar"), sc = e.querySelector("#sc"), nb = e.querySelector(".next"); let score = 0, timer = null;
    nb.onclick = next;
    function spawn() {
      const h = document.createElement("span"), dur = 3 + Math.random() * 2.2;
      h.className = "fallh"; h.textContent = ["💗", "💖", "💕", "🎀", "⭐"][Math.random() * 5 | 0];
      h.style.left = (Math.random() * 82 + 3) + "%"; h.style.animationDuration = dur + "s";
      h.addEventListener("pointerdown", ev => {
        ev.stopPropagation(); h.remove(); score++; sc.textContent = score + " / " + goal;
        if (score >= goal) win();
      });
      ar.appendChild(h); setTimeout(() => h.remove(), dur * 1000 + 150);
    }
    function win() { clearInterval(timer); ar.innerHTML = ""; sc.textContent = fmt(c.done || "You popped them all! 💖"); burst(); nb.hidden = false; }
    return { el: e, onShow() { clearInterval(timer); score = 0; ar.innerHTML = ""; nb.hidden = true; sc.textContent = "0 / " + goal; spawn(); timer = setInterval(spawn, 650); } };
  },

  match(c) {
    const syms = c.symbols || ["🐱", "🎀", "🍓", "🌸", "⭐", "🧸"];
    const e = el(`<h1>${esc(c.title)}</h1><div class="mgrid" id="g"></div><p class="hint" id="mv"></p>${nextBtn(true)}`);
    const g = e.querySelector("#g"), mv = e.querySelector("#mv"), nb = e.querySelector(".next"); nb.onclick = next;
    let first = null, lock = false, moves = 0, pairs = 0;
    function build() {
      g.innerHTML = ""; first = null; lock = false; moves = 0; pairs = 0; nb.hidden = true; mv.textContent = "moves: 0";
      shuffle([...syms, ...syms]).forEach(sym => {
        const b = document.createElement("button"); b.className = "cardm"; b.dataset.s = syms.indexOf(sym); b.setAttribute("aria-label", "card");
        b.onclick = () => {
          if (lock || b === first || b.classList.contains("done")) return;
          b.classList.add("open"); b.innerHTML = glyph(sym);
          if (!first) { first = b; return; }
          moves++; mv.textContent = "moves: " + moves;
          if (first.dataset.s === b.dataset.s) {
            first.classList.add("done"); b.classList.add("done"); first = null; pairs++;
            if (pairs === syms.length) { burst(); mv.textContent = fmt(c.done || "All matched in " + moves + " moves! 💞"); nb.hidden = false; }
          } else {
            lock = true; const a = first; first = null;
            setTimeout(() => { a.classList.remove("open"); a.textContent = ""; b.classList.remove("open"); b.textContent = ""; lock = false; }, 750);
          }
        };
        g.appendChild(b);
      });
    }
    return { el: e, onShow: build };
  },

  wish(c) {
    const e = el(`<h1>${esc(c.title)}</h1><button class="pet" id="k" aria-label="blow out the candle">🕯️</button><p id="w" class="hint">${esc(c.hint || "tap the candle to blow it out and make a wish")}</p>${nextBtn(true)}`);
    const k = e.querySelector("#k"), w = e.querySelector("#w"), nb = e.querySelector(".next"); nb.onclick = next; let done = false;
    k.onclick = () => {
      if (done) return; done = true; k.textContent = "💨";
      setTimeout(() => { k.textContent = "✨"; w.textContent = fmt(c.wish || "I wished for us 💫"); w.className = "card flip"; burst(); nb.hidden = false; }, 700);
    };
    return { el: e, onShow() { done = false; k.textContent = "🕯️"; w.className = "hint"; w.textContent = fmt(c.hint || "tap the candle to blow it out and make a wish"); nb.hidden = true; } };
  },

  fortune(c) {
    const fs = c.fortunes || ["You will be loved very, very much."];
    const e = el(`<h1>${esc(c.title)}</h1><button class="pet" id="k" aria-label="crack the cookie">🥠</button><div class="card" id="slip" hidden></div><p class="hint" id="h">${esc(c.hint || "tap the cookie to crack it")}</p>${nextBtn(true)}`);
    const k = e.querySelector("#k"), slip = e.querySelector("#slip"), h = e.querySelector("#h"), nb = e.querySelector(".next"); nb.onclick = next;
    k.onclick = () => {
      k.classList.remove("wobble"); void k.offsetWidth; k.classList.add("wobble");
      setTimeout(() => { slip.hidden = false; slip.textContent = fmt(fs[Math.random() * fs.length | 0]); slip.classList.remove("flip"); void slip.offsetWidth; slip.classList.add("flip"); h.textContent = "tap again for another one"; nb.hidden = false; burst(); }, 450);
    };
    return { el: e, onShow() { slip.hidden = true; nb.hidden = true; h.textContent = fmt(c.hint || "tap the cookie to crack it"); } };
  },

  envelope(c) {
    const e = el(`<h1>${esc(c.title)}</h1><button class="pet" id="k" aria-label="open the envelope">💌</button><div class="card" id="msg" hidden></div><p class="hint" id="h">tap to open</p>${nextBtn(true)}`);
    const k = e.querySelector("#k"), msg = e.querySelector("#msg"), h = e.querySelector("#h"), nb = e.querySelector(".next"); nb.onclick = next;
    k.onclick = () => { k.textContent = "💖"; msg.hidden = false; msg.textContent = fmt(c.text); msg.classList.add("flip"); h.hidden = true; nb.hidden = false; burst(); };
    return { el: e, onShow() { k.textContent = "💌"; msg.hidden = true; h.hidden = false; nb.hidden = true; } };
  },


  nickname(c) {
    const A = c.first || ["Mr.", "Captain", "Professor", "Little", "Sir"], B = c.second || ["Biscuit", "Sparkle", "Pookie", "Muffin", "Bubble", "Cupcake"], C = c.third || ["Bear", "Bunny", "Potato", "Kitten", "Dumpling", "Noodle"];
    const e = el(`<h1>${esc(c.title)}</h1>${c.sticker ? stick(c.sticker, "wiggle") : ""}<div class="big nick" id="n" aria-live="polite">?</div><button id="roll">Roll a nickname 🎲</button><p class="hint">tap again for a new one</p>${nextBtn(true)}`);
    const n = e.querySelector("#n"), nb = e.querySelector(".next"); let busy = false; nb.onclick = next;
    e.querySelector("#roll").onclick = () => {
      if (busy) return; busy = true; let k = 0;
      const t = setInterval(() => { n.textContent = pick(A) + " " + pick(B) + " " + pick(C); if (++k >= 8) { clearInterval(t); busy = false; nb.hidden = false; burst(); } }, 80);
    };
    return { el: e, onShow() { n.textContent = "?"; nb.hidden = true; } };
  },

  hug(c) {
    const dur = (c.seconds || 2.5) * 1000;
    const e = el(`<h1>${esc(c.title)}</h1><div class="bubble" id="b"></div><div class="hugcat" id="hc">${stick(c.sticker || "🐱")}</div><div class="meterbar"><i id="fill"></i></div><button class="hold" id="hold">${esc(c.button || "hold me 🤗")}</button>${nextBtn(true)}`);
    const b = e.querySelector("#b"), hc = e.querySelector("#hc"), fill = e.querySelector("#fill"), hold = e.querySelector("#hold"), nb = e.querySelector(".next");
    let p = 0, t = null, done = false; const msgs = ["aww…", "squeezing…", "so warm 🥰", "almost…"]; nb.onclick = next;
    function reset() { p = 0; fill.style.width = "0"; hc.style.transform = "none"; }
    function finish() { done = true; clearInterval(t); t = null; b.textContent = fmt(c.done || "Best hug ever 🥹"); burst(); nb.hidden = false; }
    function tick() {
      p = Math.min(100, p + 50 / dur * 100); fill.style.width = p + "%"; hc.style.transform = `scale(${1 + p / 100 * .35})`;
      b.textContent = fmt(msgs[Math.min(3, Math.floor(p / 25))]);
      if (navigator.vibrate && Math.round(p) % 25 === 0) navigator.vibrate(8);
      if (p >= 100) finish();
    }
    function start() { if (done || t) return; t = setInterval(tick, 50); }
    function stop() { if (!t) return; clearInterval(t); t = null; if (!done) { reset(); b.textContent = fmt(c.early || "don't let go 🥺"); } }
    hold.addEventListener("pointerdown", ev => { ev.preventDefault(); start(); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(n => hold.addEventListener(n, stop));
    hold.addEventListener("contextmenu", ev => ev.preventDefault());
    hold.addEventListener("keydown", ev => { if ((ev.key === " " || ev.key === "Enter") && !ev.repeat) { ev.preventDefault(); start(); } });
    hold.addEventListener("keyup", ev => { if (ev.key === " " || ev.key === "Enter") stop(); });
    return { el: e, onShow() { clearInterval(t); t = null; done = false; reset(); b.textContent = fmt(c.start || "hold the button to hug"); nb.hidden = true; } };
  },

  menu(c) {
    const e = el(`<h1>${esc(c.title)}</h1><div class="receipt"><div class="rh">${esc(c.cafe || "Cafe {to}")}</div>${c.items.map(it => `<div class="ri"><span>${esc(it.name)}</span><span class="lead"></span><b>${esc(it.price)}</b></div>`).join("")}<hr><div class="ri"><span>${esc(c.totalLabel || "Total")}</span><span class="lead"></span><b>${esc(c.total || "∞ hugs")}</b></div><p class="rf">${esc(c.footer || "Thank you, come again 💗")}</p></div>${nextBtn(false)}`);
    e.querySelector(".next").onclick = next; return { el: e };
  },

  choose(c) {
    const e = el(`<h1>${esc(c.title)}</h1><div class="opts">${c.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.emoji + " " + o.label)}</button>`).join("")}</div><div class="card" id="r" hidden></div>${nextBtn(true)}`);
    const r = e.querySelector("#r"), nb = e.querySelector(".next"); let first = true; nb.onclick = next;
    e.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
      const o = c.options[+btn.dataset.i]; r.hidden = false; r.textContent = fmt(o.reply || "Yes please 💗");
      r.classList.remove("flip"); void r.offsetWidth; r.classList.add("flip");
      e.querySelectorAll(".opt").forEach(x => x.classList.toggle("good", x === btn));
      nb.hidden = false; if (first) { first = false; burst(); }
    });
    return { el: e, onShow() { r.hidden = true; nb.hidden = true; first = true; e.querySelectorAll(".opt").forEach(x => x.classList.remove("good")); } };
  },

  wheel(c) {
    const P = c.prizes || [{ emoji: "😘", text: "A big kiss!" }, { emoji: "🍫", text: "Chocolate" }, { emoji: "🤗", text: "A long hug" }];
    const n = P.length, sg = 360 / n, cols = n % 2 === 0 ? ["var(--a)", "var(--paper)"] : ["var(--a)", "var(--paper)", "var(--blob)"];
    const grad = "conic-gradient(" + P.map((_, i) => `${cols[i % cols.length]} ${i * sg}deg ${(i + 1) * sg}deg`).join(",") + ")";
    const e = el(`<h1>${esc(c.title)}</h1><div class="wheelwrap"><div class="pointer">▼</div><div class="wheel" id="w" style="background:${grad}">${P.map((p, i) => `<span class="wl" style="transform:rotate(${(i + .5) * sg}deg) translateY(-92px)">${glyph(p.emoji)}</span>`).join("")}</div></div><button id="spin">Spin!</button><div class="card" id="res" hidden></div>${nextBtn(true)}`);
    const wh = e.querySelector("#w"), spin = e.querySelector("#spin"), res = e.querySelector("#res"), nb = e.querySelector(".next");
    let R = 0, busy = false; nb.onclick = next;
    spin.onclick = () => {
      if (busy) return; busy = true; spin.disabled = true; res.hidden = true;
      R += 360 * 5 + Math.random() * 360;
      wh.style.transition = rm ? "none" : "transform 4s cubic-bezier(.17,.67,.12,1)"; wh.style.transform = `rotate(${R}deg)`;
      setTimeout(() => {
        const idx = Math.floor(((360 - (R % 360)) % 360) / sg) % n;
        res.hidden = false; res.innerHTML = "<span>" + glyph(P[idx].emoji) + " " + esc(P[idx].text) + "</span>"; burst();
        busy = false; spin.disabled = false; spin.textContent = "Spin again"; nb.hidden = false;
      }, rm ? 0 : 4100);
    };
    return { el: e, onShow() { res.hidden = true; nb.hidden = true; spin.textContent = "Spin!"; } };
  },

  stickerboard(c) {
    const T = c.stickers || ["🐱", "🎀", "🍓", "🌸", "⭐", "🧸", "💗", "🍰"];
    const e = el(`<h1>${esc(c.title)}</h1><div class="board" id="bd" role="img" aria-label="sticker board"><span class="bh" id="bh">${esc(c.hint || "pick a sticker, then tap here")}</span></div><div class="tray">${T.map((t, i) => `<button class="stk${i === 0 ? " sel" : ""}" data-i="${i}" aria-label="sticker ${i + 1}">${glyph(t)}</button>`).join("")}</div><div class="btn-row"><button id="clr">Clear</button></div>${nextBtn(false)}`);
    const bd = e.querySelector("#bd"), bh = e.querySelector("#bh"); let sel = 0; e.querySelector(".next").onclick = next;
    e.querySelectorAll(".stk").forEach(b => b.onclick = () => { sel = +b.dataset.i; e.querySelectorAll(".stk").forEach(x => x.classList.toggle("sel", x === b)); });
    bd.addEventListener("pointerdown", ev => {
      const r = bd.getBoundingClientRect(), sp = document.createElement("span");
      sp.className = "placed"; sp.innerHTML = glyph(T[sel]);
      sp.style.left = ((ev.clientX - r.left) / r.width * 100) + "%"; sp.style.top = ((ev.clientY - r.top) / r.height * 100) + "%";
      sp.style.fontSize = (28 + Math.random() * 22 | 0) + "px"; sp.style.setProperty("--r", (Math.random() * 40 - 20 | 0) + "deg");
      bd.appendChild(sp); bh.hidden = true;
    });
    e.querySelector("#clr").onclick = () => { bd.querySelectorAll(".placed").forEach(x => x.remove()); bh.hidden = false; };
    return { el: e };
  },

  voice(c) {
    const e = el(`<h1>${esc(c.title)}</h1><button class="pet" id="k" aria-label="play the voice note">▶️</button><div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div><p class="hint" id="h">${esc(c.hint || "tap to play")}</p>${nextBtn(false)}`);
    const k = e.querySelector("#k"), bars = e.querySelector("#bars"), h = e.querySelector("#h"); let a = null; e.querySelector(".next").onclick = next;
    const off = () => { k.textContent = "▶️"; bars.classList.remove("on"); };
    k.onclick = () => {
      if (!a) { a = new Audio(c.src); a.onended = off; a.onerror = () => { h.textContent = "couldn't load the audio file"; off(); }; }
      if (a.paused) { a.play().catch(() => { h.textContent = "couldn't play the audio"; }); k.textContent = "⏸️"; bars.classList.add("on"); } else { a.pause(); off(); }
    };
    return { el: e, onShow() { if (a) { a.pause(); a.currentTime = 0; } off(); } };
  },

  finale(c) {
    const e = el(`<h1>${esc(c.title)}</h1>${stick(c.sticker, "wiggle")}<p>${esc(c.small)}</p><div class="btn-row"><button id="again">${esc(c.replay || "Again")}</button></div>`);
    e.querySelector("#again").onclick = () => show(0);
    return { el: e, onShow() { burst(); setTimeout(burst, 900); setTimeout(burst, 1800); } };
  }
};

const order = CONFIG.password ? [{ type: "gate" }, ...CONFIG.screens] : CONFIG.screens;
order.forEach(c => {
  const b = BUILD[c.type]; if (!b) return console.warn("Unknown screen type:", c.type);
  const s = b(c); bounceTitle(s.el); s.say = c.say || pick(MASCOT_LINES[c.type]); app.appendChild(s.el); list.push(s);
  dotsBox.appendChild(document.createElement("i"));
});

if (CONFIG.music) {
  audio = new Audio(CONFIG.music); audio.loop = true;
  const m = document.createElement("button"); m.id = "music"; m.textContent = "🎵"; m.setAttribute("aria-label", "Toggle music");
  m.onclick = () => { if (audio.paused) { audio.play().catch(() => {}); m.textContent = "🎵"; } else { audio.pause(); m.textContent = "🔇"; } };
  document.body.appendChild(m);
}
show(0);
</script>
